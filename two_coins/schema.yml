openapi: 3.0.3
info:
  title: 2coins API
  version: 0.0.1
  description: 2coins API provides functionality for the app testing and fetching
    data for charts. Documentation generated with drf-spectacular.
paths:
  /api/accounts:
    post:
      operationId: accounts_create
      summary: Create a new Account
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountSimple'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountSimple'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccountSimple'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSimple'
          description: ''
  /api/accounts/{account_id}:
    get:
      operationId: accounts_retrieve
      summary: Get Account by id
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSimple'
          description: ''
    delete:
      operationId: accounts_destroy
      summary: Delete specified Account by id
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      tags:
      - accounts
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/categories:
    post:
      operationId: categories_create
      summary: Create a new Category
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategorySimple'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategorySimple'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategorySimple'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySimple'
          description: ''
  /api/categories/{category_id}:
    get:
      operationId: categories_retrieve
      summary: Get Category by id
      parameters:
      - in: path
        name: category_id
        schema:
          type: integer
        required: true
      tags:
      - categories
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySimple'
          description: ''
    delete:
      operationId: categories_destroy
      summary: Delete specified Category by id
      parameters:
      - in: path
        name: category_id
        schema:
          type: integer
        required: true
      tags:
      - categories
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/charts/accounts:
    get:
      operationId: chart_transactions_by_accounts
      summary: Transactions by Accounts
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: End date
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Start date
      tags:
      - charts
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartData'
          description: ''
  /api/charts/accounts/{account_id}:
    get:
      operationId: chart_transactions_by_account
      summary: Transactions by specified Account
      parameters:
      - in: path
        name: account_id
        schema:
          type: integer
        required: true
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: End date
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Start date
      tags:
      - charts
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartData'
          description: ''
  /api/charts/balance-by-group:
    get:
      operationId: charts_balance_by_group_retrieve
      summary: Transactions sum by specified group type
      parameters:
      - in: query
        name: group_by
        schema:
          type: string
          enum:
          - account
          - category
        description: Grouping type for transaction sums
      tags:
      - charts
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartData'
          description: ''
  /api/charts/balance-by-period:
    get:
      operationId: charts_balance_by_period_retrieve
      summary: Transactions sum by specified group period
      parameters:
      - in: query
        name: group_by
        schema:
          type: string
          enum:
          - month
          - week
        description: Grouping period for transaction sums
      tags:
      - charts
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartData'
          description: ''
  /api/charts/categories/:
    get:
      operationId: chart_transactions_by_categories
      summary: Transactions by Categories
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: End date
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Start date
      tags:
      - charts
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartData'
          description: ''
  /api/charts/categories/{category_id}:
    get:
      operationId: chart_transactions_by_category
      summary: Transactions by specified Category
      parameters:
      - in: path
        name: category_id
        schema:
          type: integer
        required: true
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: End date
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Start date
      tags:
      - charts
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartData'
          description: ''
  /api/combined-actions:
    get:
      operationId: combined_actions_retrieve
      description: Get transactions and transfers within a specified date range (if
        not provided defaults to current month), optionally sorted by account and
        or category
      summary: Retrieves Transactions and Transfers
      parameters:
      - in: query
        name: account_id
        schema:
          type: integer
        description: Account ID to sort by
      - in: query
        name: all_transfers
        schema:
          type: boolean
        description: Include all transfers
      - in: query
        name: category_id
        schema:
          type: integer
        description: Category ID to sort by
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: End date
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Start date
      tags:
      - combined-actions
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CombinedAction'
          description: ''
  /api/transactions:
    get:
      operationId: transactions_list
      description: Get transactions within a specified date range (if not provided
        defaults to current month), optionally sorted by account and or category
      summary: Retrieves Transactions only
      parameters:
      - in: query
        name: account_id
        schema:
          type: integer
        description: Account ID to sort by
      - in: query
        name: category_id
        schema:
          type: integer
        description: Category ID to sort by
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: End date
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Start date
      tags:
      - transactions
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
          description: ''
    post:
      operationId: transactions_create
      summary: Create a new Transaction
      tags:
      - transactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionSimple'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransactionSimple'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransactionSimple'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSimple'
          description: ''
  /api/transactions/{transaction_id}:
    get:
      operationId: transactions_retrieve
      summary: Get Transaction by id
      parameters:
      - in: path
        name: transaction_id
        schema:
          type: integer
        required: true
      tags:
      - transactions
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSimple'
          description: ''
    delete:
      operationId: transactions_destroy
      summary: Delete specified Transaction by id
      parameters:
      - in: path
        name: transaction_id
        schema:
          type: integer
        required: true
      tags:
      - transactions
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/transfers:
    get:
      operationId: transfers_list
      description: Get transfers within a specified date range (if not provided defaults
        to current month), optionally sorted by account
      summary: Retrieves Transfers only
      parameters:
      - in: query
        name: account_id
        schema:
          type: integer
        description: Account ID to sort by
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: End date
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Start date
      tags:
      - transfers
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transfer'
          description: ''
components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Account name
          maxLength: 30
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Account balance
        currency:
          $ref: '#/components/schemas/Currency'
        icon:
          type: string
          nullable: true
          description: Icon name from FontAwesome
          maxLength: 50
        color:
          type: string
          maxLength: 6
        description:
          type: string
          nullable: true
          maxLength: 30
      required:
      - currency
      - id
      - name
    AccountSimple:
      type: object
      properties:
        name:
          type: string
          title: Account name
          maxLength: 30
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Account balance
        currency_id:
          type: integer
        description:
          type: string
          nullable: true
          maxLength: 30
      required:
      - currency_id
      - name
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Category name
          maxLength: 30
        category_type:
          $ref: '#/components/schemas/CategoryTypeEnum'
        icon:
          type: string
          nullable: true
          description: Icon name from FontAwesome
          maxLength: 50
        color:
          type: string
          maxLength: 6
      required:
      - id
      - name
    CategorySimple:
      type: object
      properties:
        name:
          type: string
          title: Category name
          maxLength: 30
        category_type:
          $ref: '#/components/schemas/CategoryTypeEnum'
      required:
      - name
    CategoryTypeEnum:
      enum:
      - '-'
      - +
      type: string
      description: |-
        * `-` - Expense
        * `+` - Income
    ChartData:
      type: object
      properties:
        labels:
          type: array
          items:
            type: string
            format: date-time
        datasets:
          type: array
          items: {}
      required:
      - datasets
      - labels
    CombinedAction:
      type: object
      properties:
        combined_actions:
          type: array
          items: {}
      required:
      - combined_actions
    Currency:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Currency name
          maxLength: 30
        currency_type:
          $ref: '#/components/schemas/CurrencyTypeEnum'
        symbol:
          type: string
          maxLength: 5
        abbr:
          type: string
          title: Abbreviation
          maxLength: 5
      required:
      - abbr
      - id
      - name
      - symbol
    CurrencyTypeEnum:
      enum:
      - F
      - C
      type: string
      description: |-
        * `F` - Fiat money
        * `C` - Crypto currency
    Transaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        amount_converted:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          title: Amount in account's currency
        account:
          $ref: '#/components/schemas/Account'
        category:
          $ref: '#/components/schemas/Category'
        currency:
          $ref: '#/components/schemas/Currency'
        description:
          type: string
          nullable: true
          maxLength: 50
        date:
          type: string
          format: date-time
          title: Date/time
      required:
      - account
      - amount
      - category
      - currency
      - id
    TransactionSimple:
      type: object
      properties:
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        amount_converted:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          title: Amount in account's currency
        account_id:
          type: integer
        category_id:
          type: integer
        currency_id:
          type: integer
        description:
          type: string
          nullable: true
          maxLength: 50
        date:
          type: string
          format: date-time
          title: Date/time
      required:
      - account_id
      - amount
      - category_id
      - currency_id
    Transfer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        amount_from:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Amount transferring from account
        amount_to:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Amount transferring to account
        account_from:
          $ref: '#/components/schemas/Account'
        account_to:
          $ref: '#/components/schemas/Account'
        date:
          type: string
          format: date-time
          title: Date/time
        description:
          type: string
          nullable: true
          maxLength: 50
      required:
      - account_from
      - account_to
      - amount_from
      - id
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
