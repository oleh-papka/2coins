openapi: 3.0.3
info:
  title: 2coins API
  version: 0.0.1
  description: Your project description
paths:
  /api/combined-actions/:
    get:
      operationId: combined_actions_retrieve
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: End date
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Start date
      tags:
      - combined-actions
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/transaction/:
    get:
      operationId: transaction_retrieve
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: End date
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Start date
      tags:
      - transaction
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          description: No response body
    post:
      operationId: transaction_create
      tags:
      - transaction
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionDetailed'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransactionDetailed'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransactionDetailed'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetailed'
          description: ''
  /api/transaction/{id}:
    delete:
      operationId: transaction_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - transaction
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '204':
          description: No response body
components:
  schemas:
    NestedAccount:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Account name
          maxLength: 30
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,8})?$
          title: Account balance
        currency:
          type: integer
      required:
      - currency
      - id
      - name
    TransactionDetailed:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        account:
          $ref: '#/components/schemas/NestedAccount'
        transaction_type:
          $ref: '#/components/schemas/TransactionTypeEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,8})?$
        amount_converted:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,8})?$
          nullable: true
          title: Amount in account's currency
        description:
          type: string
          nullable: true
          maxLength: 50
        date:
          type: string
          format: date-time
          title: Date/time
        category:
          type: integer
        currency:
          type: integer
      required:
      - account
      - amount
      - category
      - currency
      - id
    TransactionTypeEnum:
      enum:
      - '-'
      - +
      type: string
      description: |-
        * `-` - Expense
        * `+` - Income
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
