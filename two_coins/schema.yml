openapi: 3.0.3
info:
  title: 2coins API
  version: 0.0.1
  description: 2coins API provides basic functionality for the app. Documentation
    generated with drf-spectacular.
paths:
  /api/charts/balance/:
    get:
      operationId: charts_balance_retrieve
      tags:
      - charts
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StackedChartData'
          description: ''
  /api/charts/doughnut/:
    get:
      operationId: charts_doughnut_retrieve
      tags:
      - charts
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StackedChartData'
          description: ''
  /api/charts/transaction/group_by_account/:
    get:
      operationId: charts_transaction_group_by_account_retrieve
      tags:
      - charts
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StackedChartData'
          description: ''
  /api/charts/transaction/group_by_category/:
    get:
      operationId: charts_transaction_group_by_category_retrieve
      tags:
      - charts
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StackedChartData'
          description: ''
  /api/charts/transactions/:
    get:
      operationId: charts_transactions_retrieve
      parameters:
      - in: query
        name: absolute_values
        schema:
          type: boolean
        description: Override values to absolute values
      - in: query
        name: account_id
        schema:
          type: integer
        description: Account ID
      - in: query
        name: category_id
        schema:
          type: integer
        description: Category ID
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: End date
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Start date
      tags:
      - charts
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartData'
          description: ''
  /api/combined_actions/:
    get:
      operationId: combined_actions_retrieve
      description: Get transactions and transfers within a specified date range (if
        not provided defaults to current month), optionally sorted by account.
      summary: Retrieves Transactions and Transfers
      parameters:
      - in: query
        name: account_id
        schema:
          type: integer
        description: Account ID to sort by
      - in: query
        name: all_transfers
        schema:
          type: boolean
        description: Include all transfers
      - in: query
        name: category_id
        schema:
          type: integer
        description: Category ID to sort by
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: End date
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Start date
      tags:
      - combined_actions
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CombinedAction'
          description: ''
  /api/transactions/:
    get:
      operationId: transactions_list
      description: Get transactions within a specified date range (if not provided
        defaults to current month), optionally sorted by account or category.
      summary: Retrieves Transactions only
      parameters:
      - in: query
        name: account_id
        schema:
          type: integer
        description: Account ID to sort by
      - in: query
        name: category_id
        schema:
          type: integer
        description: Category ID to sort by
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: End date
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Start date
      tags:
      - transactions
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
          description: ''
  /api/transfers/:
    get:
      operationId: transfers_list
      description: Get transfers within a specified date range (if not provided defaults
        to current month), optionally sorted by account.
      summary: Retrieves Transfers only
      parameters:
      - in: query
        name: account_id
        schema:
          type: integer
        description: Account ID to sort by
      - in: query
        name: end_date
        schema:
          type: string
          format: date
        description: End date
      - in: query
        name: start_date
        schema:
          type: string
          format: date
        description: Start date
      tags:
      - transfers
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transfer'
          description: ''
components:
  schemas:
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Account name
          maxLength: 30
        balance:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Account balance
        currency:
          $ref: '#/components/schemas/Currency'
        icon:
          type: string
          nullable: true
          description: Icon name from FontAwesome
          maxLength: 50
        color:
          type: string
          maxLength: 6
        description:
          type: string
          nullable: true
          maxLength: 30
      required:
      - currency
      - id
      - name
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Category name
          maxLength: 30
        category_type:
          $ref: '#/components/schemas/CategoryTypeEnum'
        icon:
          type: string
          nullable: true
          description: Icon name from FontAwesome
          maxLength: 50
        color:
          type: string
          maxLength: 6
      required:
      - id
      - name
    CategoryTypeEnum:
      enum:
      - '-'
      - +
      type: string
      description: |-
        * `-` - Expense
        * `+` - Income
    ChartData:
      type: object
      properties:
        labels:
          type: array
          items:
            type: string
            format: date-time
        data:
          type: array
          items:
            type: integer
      required:
      - data
      - labels
    CombinedAction:
      type: object
      properties:
        combined_actions:
          type: array
          items: {}
      required:
      - combined_actions
    Currency:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Currency name
          maxLength: 30
        currency_type:
          $ref: '#/components/schemas/CurrencyTypeEnum'
        symbol:
          type: string
          maxLength: 5
        abbr:
          type: string
          title: Abbreviation
          maxLength: 5
      required:
      - abbr
      - id
      - name
      - symbol
    CurrencyTypeEnum:
      enum:
      - F
      - C
      type: string
      description: |-
        * `F` - Fiat money
        * `C` - Crypto currency
    StackedChartData:
      type: object
      properties:
        labels:
          type: array
          items:
            type: string
            format: date-time
        datasets:
          type: array
          items: {}
      required:
      - datasets
      - labels
    Transaction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        amount_converted:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
          title: Amount in account's currency
        account:
          $ref: '#/components/schemas/Account'
        category:
          $ref: '#/components/schemas/Category'
        currency:
          $ref: '#/components/schemas/Currency'
        description:
          type: string
          nullable: true
          maxLength: 50
        date:
          type: string
          format: date-time
          title: Date/time
      required:
      - account
      - amount
      - category
      - currency
      - id
    Transfer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        amount_from:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Amount transferring from account
        amount_to:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Amount transferring to account
        account_from:
          $ref: '#/components/schemas/Account'
        account_to:
          $ref: '#/components/schemas/Account'
        date:
          type: string
          format: date-time
          title: Date/time
        description:
          type: string
          nullable: true
          maxLength: 50
      required:
      - account_from
      - account_to
      - amount_from
      - id
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
